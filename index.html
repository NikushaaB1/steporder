<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Ordering</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- HEADER -->
  <header id="header" class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-step">Step</span>
        <span class="logo-ordering">Ordering</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-link">Home</a>
        <a href="#" id="cartBtn" class="cart-btn">
          Cart
          <span id="cartCount">0</span>
          <svg class="scooter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="white">
            <circle cx="14" cy="48" r="7" stroke="white" stroke-width="3" fill="none"/>
            <circle cx="50" cy="48" r="7" stroke="white" stroke-width="3" fill="none"/>
            <path d="M21 48 H43" stroke="white" stroke-width="3"/>
            <path d="M50 41 L42 22 L28 22 L21 34 L14 34" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M28 22 L26 16 L36 16" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <path d="M42 22 L50 22 L50 30" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Fast And Efficient, Online Ordering You Must Try.</h1>
    </div>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <h2 class="categories-title">Categories</h2>
    <div id="categoryTabs" class="category-tabs"></div>
    <div class="divider"></div>
    <div class="content-row">
      <!-- FILTER -->
      <div class="filter-box">
        <div class="filter-header">
          <span>Filter</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="filter-icon">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
        </div>
        <div class="filter-body">
          <div id="spiceVal" class="spiciness-label">Not Chosen</div>
          <div class="slider-wrap">
            <input id="spiceSlider" type="range" min="0" max="5" value="0" class="spiciness-slider" />
          </div>
          <label class="checkbox-label">
            <input id="noNuts" type="checkbox" /> No Nuts
          </label>
          <label class="checkbox-label">
            <input id="vegOnly" type="checkbox" /> Vegetarian Only
          </label>
          <button id="btnReset" class="btn-reset">RESET</button>
          <button id="btnApply" class="btn-apply">APPLY FILTER</button>
        </div>
      </div>

      <!-- MENU CARDS -->
      <div id="cardsGrid" class="cards-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <p>© Step Ordering 2026, All rights reserved</p>
  </footer>

  <!-- CART DRAWER -->
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button id="cartClose">&times;</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div>Total: <span id="cartTotal">$0.00</span></div>
    </div>
  </div>
  <div id="cartOverlay" class="cart-overlay"></div>

  <!-- PRODUCT MODAL -->
  <div id="productModal" class="modal">
    <div id="modalOverlay" class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <button id="modalClose">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
