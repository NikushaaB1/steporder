<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Ordering — Delicious Food Delivered</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lato:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="header" id="header">
    <div class="header-inner">
      <a href="#" class="logo">
        <span class="logo-step">Step</span>
        <span class="logo-ordering">Ordering</span>
      </a>
      <nav class="nav">
        <a href="#" class="nav-link active">Home</a>
        <a href="#categories" class="nav-link">Menu</a>
        <a href="#" class="nav-link">About</a>
        <button class="cart-btn" id="cartBtn">
          <svg class="scooter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/>
            <path d="M6 18h8l3-9h4M9 9h6l-2 9"/>
          </svg>
          <span>Cart</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-eyebrow">Welcome to Step Ordering</span>
      <h1>Fast & Efficient<br/><span class="accent">Online Ordering</span> You Must Try.</h1>
      <p class="hero-sub">Fresh ingredients, bold flavors, delivered to your door in minutes.</p>
      <a href="#categories" class="hero-cta">Order Now →</a>
    </div>
  </section>

  <section class="categories" id="categories">
    <h2 class="categories-title">Categories</h2>

    <div class="category-tabs" id="categoryTabs">
    </div>

    <hr class="divider" />

    <div class="content-row">
      <aside class="filter-box">
        <div class="filter-header">
          <span>Filter</span>
          <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M6 12h12M10 18h4"/>
          </svg>
        </div>
        <div class="filter-body">
          <div>
            <p class="spiciness-label">Spiciness: <span id="spiceVal">Not Chosen</span></p>
            <div class="slider-wrap">
              <input type="range" min="0" max="5" value="0" class="spiciness-slider" id="spiceSlider"/>
            </div>
          </div>

          <label class="checkbox-label">
            <input type="checkbox" id="noNuts"/> No Nuts
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="vegOnly"/> Vegetarian Only
          </label>

          <button class="btn-reset" id="btnReset">RESET</button>
          <button class="btn-apply" id="btnApply">APPLY FILTER</button>
        </div>
      </aside>

      <div class="cards-grid" id="cardsGrid">
      </div>
    </div>
  </section>

  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="product-modal" id="productModal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-head">
      <h3>Your Cart</h3>
      <button class="cart-close" id="cartClose">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
      <button class="checkout-btn">Checkout</button>
    </div>
  </aside>

  <footer class="footer">
    © Step Ordering 2026, All rights reserved
  </footer>

  <script src="script.js"></script>
</body>
</html>
